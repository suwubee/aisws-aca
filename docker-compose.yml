services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-coding-assistant:latest
    restart: unless-stopped
    ports:
      - "34007:34007"
    volumes:
      - ./data:/app/data
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-34007}
      DATABASE_DSN: ${DATABASE_DSN:-./data/aca.db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}
      TERMINAL_SHELL: ${TERMINAL_SHELL:-/bin/bash}
      TERMINAL_DEFAULT_LOGIN_DIR: ${TERMINAL_DEFAULT_LOGIN_DIR:-~/}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${SERVER_PORT:-34007}/api/health >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
